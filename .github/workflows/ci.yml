name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # The suite is offline by design: no key, no network calls, no iRacing.
      KIMI_CODE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - name: Install
        run: python -m pip install -r requirements-dev.txt -e ".[mcp]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Offline smoke test
        run: python scripts/smoke_offline.py

  real-data:
    # The same suite's real-telemetry tests (tests/test_real_ibt.py) on a 42-minute
    # iRacing race. The tests themselves stay offline; only this step downloads the
    # pinned, sha256-checked fixture, and the cache means that happens rarely.
    runs-on: ubuntu-latest
    env:
      KIMI_CODE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - name: Install
        run: python -m pip install -r requirements-dev.txt -e .
      - name: Cache real telemetry fixtures
        uses: actions/cache@v4
        with:
          path: tests/fixtures/real
          key: real-fixtures-${{ hashFiles('scripts/fetch_fixtures.py') }}
      - name: Fetch real telemetry fixtures
        run: python scripts/fetch_fixtures.py
      - name: Real-data tests
        run: pytest -q tests/test_real_ibt.py -rs
