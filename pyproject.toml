[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racing-telemetry-visualiser"
version = "0.1.0"
description = "Backend that ingests all iRacing telemetry (live SDK + .ibt files) and serves it to a web frontend for graphs, charts and track maps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Racing Telemetry Visualiser" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyirsdk>=1.3.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "duckdb>=0.10",
    "pyarrow>=15",
    "orjson>=3.9",
    "PyYAML>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.9",
    # The Layer-3b graph agent + its hermetic evals run in CI; guarded by importorskip.
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
# Layer 2 — local MCP server (driven from Claude Desktop / Claude Code).
mcp = [
    "mcp>=1.2",
    "httpx>=0.27",
]
# Layer 3a — Claude API orchestration + evals (the async multi-agent showcase).
ai = [
    "anthropic>=0.40",
    "httpx>=0.27",
]
# Layer 3b — the LangGraph coach agent: tool-calling loop, grounded refusal, in-loop
# citation validation, and the hermetic eval harness on top. `anthropic` is only needed
# for a live model; the tests drive a scripted fake and never import it.
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "anthropic>=0.40",
    "langchain-anthropic>=0.2",
]

[project.scripts]
rtv = "rtv.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends()` in argument defaults is the idiomatic pattern.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
packages = ["rtv"]
ignore_missing_imports = true
