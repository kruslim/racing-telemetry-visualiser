[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racing-telemetry-visualiser"
version = "0.1.0"
description = "iRacing telemetry (live or .ibt) with a deterministic race-state engine, a Kimi-backed AI pitwall and post-session coaching."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Racing Telemetry Visualiser" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyirsdk>=1.3.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "duckdb>=0.10",
    "pyarrow>=15",
    "orjson>=3.9",
    "PyYAML>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.9",
    # The Layer-3b graph agent + its hermetic evals run in CI; guarded by importorskip.
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
# Layer 2 — local MCP server (driven from Claude Desktop / Claude Code).
mcp = [
    "mcp>=1.2,<2",  # 2.x renamed FastMCP; telemetry_coach.py targets the v1 API
    "httpx>=0.27",
]
# The pitwall agents and the Layer-3a orchestrator (and the eval judge on kimi). They talk to
# Kimi Code, whose endpoint speaks the Anthropic Messages format, so the anthropic SDK
# is the transport (it never calls Anthropic).
ai = [
    "anthropic>=0.40",
    "httpx>=0.27",
]
# Layer 3b — the LangGraph coach agent: tool-calling loop, grounded refusal, in-loop
# citation validation, and the hermetic eval harness on top. langchain-anthropic is the
# transport to Kimi Code; the tests drive a scripted fake and never import it.
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "anthropic>=0.40",
    "langchain-anthropic>=0.2",
]
# The eval judge on Gemini (evals/judge_provider.py), the one non-Kimi model, used only
# in evals/. Nothing under src/rtv imports it.
judge = [
    "google-genai>=1.0",
]
# RTV Desktop — the native Qt client (rtv.desktop); the server runs embedded in it.
desktop = [
    "PySide6>=6.7",
]
# Push-to-talk speech-to-text in RTV Desktop (rtv.desktop.voice): faster-whisper on the
# CPU, so no audio leaves the PC. Imported lazily; without it the talk button says so.
voice = [
    "faster-whisper>=1.0",
]

[project.scripts]
rtv = "rtv.__main__:main"

[project.gui-scripts]
rtv-desktop = "rtv.desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rtv = ["desktop/rtv.png"]
"rtv.tracks" = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends()` in argument defaults is the idiomatic pattern.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
packages = ["rtv"]
ignore_missing_imports = true
